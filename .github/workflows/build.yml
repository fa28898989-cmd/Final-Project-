name: Build APK

on:
  push:
    branches: [ main, master, New ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Locate project folder
        run: |
          GW=$(find . -name gradlew -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$GW" ]; then
            echo "gradlew not found. Files in repo:"; find . -maxdepth 3 -not -path "./.git/*" | head -50
            exit 1
          fi
          DIR=$(dirname "$GW")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project found in: $DIR"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MovieLink-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
