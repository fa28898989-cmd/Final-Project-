name: Build APK

on:
push:
branches: [ main, master, New ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 40

steps:
  - uses: actions/checkout@v4

  - name: Unzip project and detect Gradle root
    run: |
      mkdir -p project
      unzip -q -o Noxera-Android-Compose.zip -d project

      SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

      if [ -z "$SETTINGS" ]; then
        echo "ERROR: settings.gradle or settings.gradle.kts not found!"
        find project -maxdepth 4 -type f | head -n 100
        exit 1
      fi

      PROJECT_DIR=$(dirname "$SETTINGS")

      if [ ! -f "$PROJECT_DIR/gradlew" ]; then
        echo "ERROR: gradlew not found in Gradle root: $PROJECT_DIR"
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Detected Gradle root: $PROJECT_DIR"

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Accept Android SDK licenses
    run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

  - uses: gradle/actions/setup-gradle@v4

  - name: Build debug APK
    working-directory: ${{ env.PROJECT_DIR }}
    run: |
      chmod +x ./gradlew

      for attempt in 1 2 3; do
        if ./gradlew assembleDebug --stacktrace --no-daemon; then
          exit 0
        fi

        if [ "$attempt" -lt 3 ]; then
          echo "Gradle build failed (attempt $attempt/3). Waiting 30s..."
          sleep 30
        fi
      done

      exit 1

  - uses: actions/upload-artifact@v4
    with:
      name: Noxera-debug-apk
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
