name: Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Gradle project (root or subfolder)
        id: loc
        run: |
          G=$(find . -name gradlew -not -path './.git/*' | head -1)
          if [ -z "$G" ]; then
            echo "gradlew not found anywhere in the repo. Files:"; ls -R | head -50; exit 1
          fi
          DIR=$(dirname "$G")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: movielink-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
