name: Build APK

on:
  push:
    branches: [ main, master, New ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q -o MovieLink-Android-Compose.zip -d project
          # handle a zip that has a single top-level folder
          if [ ! -f project/gradlew ]; then
            GW=$(find project -name gradlew | head -n 1)
            [ -z "$GW" ] && { echo "gradlew not found in zip"; exit 1; }
            echo "PROJECT_DIR=$(dirname "$GW")" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --stacktrace --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build failed (attempt $attempt/3). Waiting 30s before retrying..."
              sleep 30
            fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: MovieLink-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
